    "Բեզոարյան այծը վայրի այծերի ցեղին պատկող հոյակապ կենդանի է, որը համաշխարհային մասշտաբով հայտնի է որպես ընտանի այծերի ուղղակի և հիմնական նախնին։ Արուներն աչքի են ընկնում իրենց հսկայական, սուր, մինչև մեկ մետր երկարություն ունեցող, հետ թեքված սրբաձև եղջյուրներով, որոնք նման են վիթխարի թրերի։ Էգերն ունեն շատ ավելի կարճ և բարակ եղջյուրներ։ Նրանց մարմինը վառ դարչնագույն է՝ մեջքի երկայնքով ձգվող սև շերտով, իսկ որովայնը և վերջույթների ծայրերը ավելի բաց գույնի են։",
    "Այս կենդանիները բնակվում են Հայաստանի առավել անառիկ, ժայռոտ և դժվարհասանելի վայրերում՝ խոր կիրճերում, ուղղահայաց ժայռափորվածքներում և ալպյան գոտիների քարքարոտ լանջերին։ Նրանց հիմնական ապաստարաններն են Խոսրովի անտառ պետական արգելոցը, Զանգեզուրի և Վայքի լեռնաշղթաների քարվանները։ Բեզոարյան այծերը բացառիկ ճարպիկ և անվախ լեռնագնացներ են․ նրանք կարող են կանգնել ժայռի այնպիսի նեղ ելուստների վրա, որոնք թվում են անհնարին, և կատարել հսկայական ցատկեր վտանգի պահին:",
    "Սնվում են չորս եթերայուղերով հարուստ լեռնային խոտաբույսերով, թփերի ընձյուղներով, ծառերի կեղևով և նույնիսկ փշոտ բույսերով, որոնցից այլ կենդանիներ հրաժարվում են։ Ձմռանը, երբ ձյունը շատ է լինում, նրանք հավաքվում են քամիներից պաշտպանված ժայռերի տակ։ Բեզոարյան այծերի կազմված հոտերը կարևոր դեր ունեն բնության մեջ՝ նրանք նպաստում են բույսերի սերմերի տարածմանը և միաժամանակ հանդիսանում են տեղական էկոհամակարգի խոշոր գիշատիչների՝ ընձառյուծների գոյության հիմնական երաշխիքը։",
    "Բեզոարյան այծը գրանցված է Հայաստանի Կարմիր գրքում և պահպանվում է հատուկ բնական տարածքներում։ Պատմականորեն նրանց որսացել են ինչպես մսի և մորթու, այնպես էլ ստամոքսում առաջացող հատուկ «բեզոարյան քարերի» (որոնք միջնադարում արժեքավոր դեղամիջոց են համարվել) համար։ Այսօր պետական խիստ հսկողության և արգելոցների գործունեության շնորհիվ Հայաստանում նրանց պոպուլյացիան գտնվում է կայուն և վերահսկվող վիճակում։"
  ]
},

  d:[
    "Կովկասյան գորշ արջը Հայաստանի անտառների ամենախոշոր, ուժեղ և հիասքանչ ամենակեր կենդանին է։ Նրա մարմինը ծածկված է հաստ, խիտ, բաց գորշից մինչև մուգ շագանակագույն մորթով։ Արջերն ունեն հզոր վերջույթներ՝ երկար ու սուր ճանկերով, որոնք նրանց օգնում են հողը փորելիս, ծառեր մագլցելիս կամ որս անելիս։ Չնայած իրենց ծանրակշիռ տեսքին՝ նրանք կարող են զարգացնել զարմանալիորեն բարձր արագություն կարճ տարածությունների վրա և հիանալի լողում են:",
    "Ապրում է հիմնականում Հայաստանի անտառապատ լեռնային շրջաններում՝ Լոռու, Տավուշի, Սյունիքի և Վայոց ձորի խիտ անտառներում, ինչպես նաև ենթալպյան գոտիների բացատներում։ Ձմռան գալստուն պես (նոյեմբեր-դեկտեմբեր ամիսներին) արջերը նախապատրաստում են խորը, ապահով որջեր (քարանձավների խորշերում կամ ծառերի հաստ արմատների տակ) և մտնում ձմեռային քնի, որը կարող է տևել մինչև 3-4 ամիս։ Այս ընթացքում նրանք ոչինչ չեն ուտում, այլ ապրում են ամռանը կուտակված ճարպային պաշարների հաշվին։",
    "Արջի սննդակարգը չափազանց բազմազան է․ այն սնվում է ինչպես բուսական (հատապտուղներ, ընկույզներ, արմատներ, կաղին, մրգեր), այնպես էլ կենդանական ծագման սննդով (միջատներ, մեղր, կրծողներ, երբեմն նաև սմբակավորների միս)։ Նրանք անտառի իսկական «սניտարներ» են և կարևորագույն դեր ունեն բնության մեջ՝ հատկապես սերմերի տարածման և անտառային հողերի փխրեցման գործում։",
    "Հայաստանում գորշ արջերի թիվը խիստ վերահսկվում է։ Թեև նրանք լայն տարածում ունեն անտառային գոտիներում, մարդու կողմից անտառների հատումները, ճանապարհների անցկացումը և գյուղատնտեսական հանդ<bos>10-ների ընդլայնումը հաճախ հանգեցնում են մարդ-արջ հակամարտությունների։ Տեսակը պահպանվում է պետության կողմից, և արջերի բնական միջավայրի անձեռնմխելիությունը կենսական նշանակություն ունի նրանց գոյատևման համար։"
  ]

  d:[
    "Սև արագիլը հիասքանչ, բայց չափազանց զգույշ և թաքուն կենսակերպ վարող խոշոր թռչուն է։ Նրա մարմնի վերին մասը, թևերն ու գլուխը պատված են սև փետուրներով, որոնք արևի տակ շողում են կանաչավուն ու մանուշակագույն մետաղական փայլով, իսկ որովայնը ձյան պես սպիտակ է։ Նրանց երկար կտուցն ու բարակ ոտքերը վառ կարմիր գույն ունեն, ինչը նրանց շատ արտահայտիչ տեսք է տալիս։ Ի տարբերություն իրենց հայտնի սպիտակ ազգականների, սև արագիլները երբեք չեն բնակվում մարդկանց բնակավայրերի կամ գյուղերի մոտ։",
    "Այս թռչունները բնադրման համար ընտրում են խիստ խուլ, անմատչելի անտառային գետահովիտներ, խոր կիրճեր և անառիկ ժայռոտ տեղանքներ։ Հայաստանում նրանց կարելի է հանդիպել հյուսիսային և հարավային անտառային գետերի ափերին՝ Դեբեդի, Աղստևի, Հրազդանի և Արփայի կիրճերում։ Նրանք իրենց հսկայական բները հյուսում են հին, հաստաբուն ծառերի սաղարթներում կամ ուղղահայաց ժայռերի անմատչելի թիթεզների վրա՝ օգտագործելով դրանք տարիներ շարունակ։",
    "Սև արագիլները բացառիկ ջրասեր և մսակեր թռչուններ են․ նրանց սննդի հիմքը կազմում են մանր գետային ձկները, ջրային միջատները, գորտերը, մողեսները և նույնիսկ մանր կրծողները։ Նրանք անթերի որսորդներ են, որոնք կարող են երկար ժամանակ անշարժ կանգնել ջրի եզրին՝ սպասելով որսին։ Սև արագիլը չվող թռչուն է․ աշնանը նրանք հավաքվում են փոքր երամների և չვენ տաք երկրներ (Աֆրիկա կամ Մերձավոր Արևելք)՝ գարնանը կրկին վերադառնալու համար։",
    "Տեսակը գրանցված է Հայաստանի Կարմիր գրքում։ Սև արագիլների թվաքանակի վրա բացասաբար են ազդում անտառահատումները, գետերի հուների փոփոխությունները, ջրամբարների աղտոտումը և մարդու անհանգստացնող գործոնը բնադրման շրջանում։ Նրանց պաշտպանության համար խիստ կարևոր է նրանց բնակավայրերի խաղաղության և անձեռնմխելիության ապահովումը արգելոցներում։"

  d:[
    "Վարդակակաչ Սոսնովսկուց գեղեցիկ, վառ կրակագույն-կարմիր ծաղիկներով զարդարված այս սոխուկավոր բույսը Հայկական լեռնաշխարհի և Հայաստանի հպարտությունն ու բնաշխարհի եզակի էնդեմիկներից է։ Այն ունի գեղեցիկ, նեղ կապտականաչավուն տերևներ և մեծ, զանգակաձև ծաղիկ, որի հիմքում՝ ներսի կողմից, հաճախ նկատվում է բնորոշ մուգ կամ սև բիծ։ Այս վայրի վարդակակաչը հանդիսանում է մեր մարգագետինների գարնանային զարդը, որը արթնացնում է բնությունը ձմեռային քնից հետո։",
    "Աճում է ցածրադիր և միջին լեռնային գոտիների չոր լեռնալանջերին, քարքարոտ տափաստաններում և կիսաանապատային տարածքներում։ Քանի որ նրա ակտիվ աճի և ծաղկման շրջանը համընկնում է գարնանային անձրևների ժամանակաշրջանի հետ, արդեն ամառային սկզբին հողի չորանալուն պես բույսի վերգետնյա մասը չորանում է, իսկ սոխուկը խորը հողի տակ մնում է հանգստի վիճակում՝ սպասելով հաջորդ գարնանը։",
    "Էկոլոգիական տեսանկյունից այս վայրի ծաղիկը ունի հսկայական նշանակություն․ այն գարնանը ծառայում է որպես առաջին հիմնական մեղրատու և սննդաղբյուր արթնացող փոշոտող միջատների (մեղուների, բզեզների, թիթեռների) համար։ Բույսը հարմարված է լեռնային խիստ կլիմային և ունի սոխուկային սննդանյութերի մեծ պաշարներ, ինչը թույլ է տալիս նրան դիմանալ գարնանային կտրուկ ցրտահարություններին։",
    "Տեսակը գրանցված է Հայաստանի Կարմիր գրքում։ Նրանց պոպուլյացիաներին լուրջ վտանգ են սպառնում գարնանը մարդկանց կողմից զանգվածաբար ծաղիկների պոկումը (վաճառքի նպատակով) և գյուղատնտեսական կենդանիների անվերահսկելի արածեցումը ծաղկման շրջանում։ Բնության պահպանության համար խիստ կարևոր է նման հազվագյուտ վայրի ծաղիկների չպոկելը և դրանց աճելավայրերի անխախտ պահպանումը։"
  ]

  d:[
    "Թրաշուշան Ջավախքի բազմամյա, գեղեցիկ ու շատ նրբագեղ բույս է, որն աչքի է ընկնում իր ուղղաձիգ, նեղ թրաձև տերևներով և հասկանման ծաղկաբույլեր հավաքված վարդագույն-մանուշակագույն ծաղիկներով։ Ծաղկման շրջանում այս բույսը իր գույներով զարդարում է լեռնային բարձրադիր տարածքները։ Իր անունը ստացել է տերևների թրի նմանվող ձևից, որոնք ամուր գրկում են բույսի ցողունը։",
    "Աճում է բարձրադիր լեռնային մարգագետիններում, գետերի հովիտներում, լճերի ափամերձ խոնավ հողերում և ալպյան գոտիների հարուստ հողերում։ Հայաստանում այն հանդիպում է հյուսիսային մարզերում և հարակից Ջավախքի լեռնաշղթայի տարածքում։ Այս բույսը նախընտրում է չափավոր խոնավ և սննդարար հողեր, որտեղ արևի լույսը լիովին հասնում է հողին:",
    "Ծաղկում է ամռան տաք ամիսներին՝ հունիսից մինչև հուլիսի վերջը։ Այն հանդիսանում է լեռնային մարգագետինների կենսաբազմազանության անբաժանելի մասը՝ ապահովելով միջատների փոշոտման պայմանները և հարստացնելով տեղական բուսական աշխարհը։ Բույսը ստորգետնյա մասում ունի պալարասոխուկ, որը կուտակում է սննդանյութեր ձմեռային ցրտերին դիմանալու համար։",
    "Գրանցված է Հայաստանի Կարմիր գրքում՝ որպես խոցելի և հազվագյուտ տեսակ։ Նրա գոյությանը սպառնում են մարգագետինների ինտենսիվ գերարածեցումը, հողերի հաշվառման ու յուրացման աշխատանքները, ինչպես նաև գեղեցիկ ծաղիկների պատճառով զանգվածային հավաքումն ու պոկումը։ Բույսի պահպանությունը պահանջում է հատուկ ուշադրություն լեռնային արածեցման կանոնակարգման հարցում։"

  d:[
    "Վարդակուկ ոսկեզօծը զարմանահրաշ և յուրահատուկ սուկուլենտ բույս է, որն ունի հաստ, մսոտ տերևներ՝ դասավորված գեղեցիկ կլորավուն վարդակների տեսքով։ Ծաղկման շրջանում այն արձակում է վառ դեղին, աստղաձև ծաղիկներով ցողուններ, որոնք գեղեցիկ հակադրվում են մուգ կանաչ կամ մոխրագույն մսոտ տերևների հետ։ Այս բույսը իսկական բնական հրաշք է, քանի որ կարող է դիմանալ այնպիսի պայմանների, որոնցում այլ բույսեր անմիջապես կմահանան։",
    "Աճում է չոր, քարքարոտ լանջերին, մերկ ժայռերի խորը ճեղքերում և քարվաններում, որտեղ հողի շերտը գրեթե բացակայում է, և արմատները ստիպված են ամրանալ ուղղակի քարերի մեջ։ Հայաստանում այն լայնորեն տարածված է լեռնային տարբեր շրջաններում։ Նրա մսոտ տերևները ունեն խոնավություն կուտակելու հատկություն, ինչը թույլ է տալիս բույսին հեշտությամբ հաղթահարել ամառային անխնա երաշտն ու տապը։",
    "Բուսաբանական և էկոլոգիական տեսանկյունից այս բույսը մեծ դեր ունի լեռնային էկոհամակարգերում․ այն բնակեցնում է անպտուղ ժայռային մակերեսները՝ ստեղծելով նախադրյալներ այլ օրգանիզմների համար և կանխելով ժայռերի էրոզիան ու հողաթափությունը։ Բազմապատկվում է ինչպես սերմերով, այնպես էլ վեգետատիվ ճանապարհով՝ հիմնական մայրական վարդակի շուրջ առաջացող փոքրիկ դուստր վարդակների միջոցով։",
    "Համարվում է հազվագյուտ լեռնային բույս։ Չնայած այն աճում է դժվարհասանելի ժայռերում, մարդու տնտեսական գործունեությունը (լեռնարդյունաբերություն, քարհանքերի բացում, ճանապարհաշինություն) կարող է վտանգել նրա բնական բնակավայրերը։ Բույսի պահպանության համար խիստ կարևոր է լեռնային լանջերի և բնական ժայռապատկերների անխախտ պահպանումը։"

const API="https://en.wikipedia.org/api/rest_v1/";
const BAD=/map|range|distribution|status|iucn|symbol|icon|logo|flag|coat|stamp|cites|skull|skeleton|diagram|chart|illustration|drawing|plate|painting|taxobox/i;
const sz=(s,n)=>s.replace(/\/\d+px-/,"/"+n+"px-");
const IMGS={};
function wiki(i){
  if(IMGS[i])return IMGS[i];
  return IMGS[i]=(async()=>{
    for(const t of WT[i]){
      try{
        const r=await fetch(API+"page/summary/"+t);
        if(!r.ok)continue;
        const j=await r.json();
        const lead=j.originalimage||j.thumbnail;
        if(!lead)continue;
        const base=(j.thumbnail||j.originalimage).source;
        const out={main:base,gal:[]};
        const leadName=decodeURIComponent(lead.source.split("/").filter(Boolean).pop()).replace(/^\d+px-/,"").replace(/_/g," ");
        try{
          const title=(j.titles&&j.titles.canonical)||t;
          const m=await fetch(API+"page/media-list/"+encodeURIComponent(title));
          if(m.ok){
            const mj=await m.json();
            for(const it of (mj.items||[])){
              if(it.type!=="image"||!it.srcset||!it.srcset.length)continue;
              const nm=(it.title||"").replace(/^File:/,"").replace(/_/g," ");
              if(!/\.(jpe?g|webp)$/i.test(nm)||BAD.test(nm)||nm===leadName)continue;
              let s=it.srcset[0].src;
              if(s.indexOf("//")===0)s="https:"+s;
              out.gal.push(s);
              if(out.gal.length>=3)break;
            }
          }
        }catch(e){}
        while(out.gal.length<3)out.gal.push(out.gal[0]||base);
        return out;
      }catch(e){}
    }
    return null;
  })();
}
function setImg(el,u){
  if(!u){el.style.display="none";return;}
  el.onerror=()=>{ if(el.getAttribute("src")!==u){el.src=u;}else{el.style.display="none";} };
  el.src=sz(u,500);
}
function hydrate(){
  document.querySelectorAll("img[data-wi]").forEach(el=>{
    const i=+el.dataset.wi,k=el.dataset.k;
    wiki(i).then(d=>{
      if(!d){el.style.display="none";return;}
      setImg(el,k==="m"?d.main:d.gal[+k]);
    });
  });
}
