const SEC=["Ընդհանուր նկարագրություն","Տարածվածություն և ապրելավայրեր","Կենսակերպ, բազմացում և էկոլոգիա","Պահպանության վիճակը"];

let cat="all",tag=null,query="";
const $=id=>document.getElementById(id);

function filtered(){
  return D.map((x,i)=>({...x,i})).filter(x=>
    (cat==="all"||x.t===cat)&&(!tag||x.tg.includes(tag))&&
    (x.n+x.l+x.d.join(" ")).toLowerCase().includes(query.toLowerCase()));
}
function go(h){location.hash=h;route();}
function renderChrome(){
  $("tabs").innerHTML=[["all","Բոլորը"],["a","Կենդանիներ"],["p","Բույսեր"]].map(([k,t])=>
    `<button onclick="cat='${k}';go('');" class="px-4 py-2 text-sm border-b-2 ${cat===k?'border-emerald-700 font-bold text-emerald-800':'border-transparent text-gray-600'}">${t}</button>`).join("");
  $("badges").innerHTML=[R,E,V].map(b=>
    `<button onclick="tag=tag==='${b}'?null:'${b}';go('');" class="text-xs px-2 py-1 rounded-full border ${tag===b?'bg-emerald-700 text-white':'bg-gray-50'}">${b}</button>`).join("");
  const f=filtered();
  $("toc").innerHTML=f.length?f.map((x,k)=>`<li><a href="#a${x.i}" class="hover:underline">${k+1}. ${x.n}</a></li>`).join(""):"<li class='text-gray-500'>Արդյունք չկա</li>";
}
function renderList(){
  const f=filtered();
  $("main").innerHTML=`<h2 class="text-2xl font-serif mb-1">Բոլոր հոդվածները</h2>
  <p class="text-sm text-gray-500 mb-4">Գտնվել է հոդված՝ ${f.length}</p>
  <div class="grid sm:grid-cols-2 gap-4">${f.map(x=>`
    <a href="#a${x.i}" class="border rounded overflow-hidden hover:shadow-md transition bg-white block p-4 flex gap-4 items-center">
      <div class="w-20 h-20 bg-emerald-100 rounded flex items-center justify-center text-4xl shrink-0">${x.e}</div>
      <div><h3 class="font-bold text-blue-800">${x.n}</h3>
      <p class="sci text-sm text-gray-600">${x.l}</p>
      <div class="mt-2 flex flex-wrap gap-1">${x.tg.map(b=>`<span class="text-xs bg-amber-100 text-amber-800 px-2 rounded-full">${b}</span>`).join("")}</div></div>
    </a>`).join("")||"<p>Ոչինչ չի գտնվել։</p>"}</div>`;
}
function renderArticle(i){
  const x=D[i];
  $("main").innerHTML=`<a href="#" class="text-sm text-blue-700 hover:underline">← Վերադառնալ ցանկին</a>
  <h2 class="text-3xl font-serif border-b border-gray-400 mt-2 pb-1">${x.n}</h2>
  <p class="sci text-gray-600 mb-3">${x.l}</p>
  <table class="ib float-none md:float-right md:ml-5 mb-4 w-full md:w-80 border border-gray-300 bg-gray-50">
    <tr><td colspan="2" class="text-center font-bold bg-emerald-100">${x.n}</td></tr>
    <tr><td colspan="2" class="text-center py-6 text-7xl bg-emerald-50">${x.e}</td></tr>
    <tr><th colspan="2" class="text-center">Գիտական դասակարգում</th></tr>
    <tr><th>Թագավորություն</th><td>${x.k}</td></tr>
    <tr><th>Դաս</th><td>${x.c}</td></tr>
    <tr><th>Ընտանիք</th><td>${x.f}</td></tr>
    <tr><th>Ցեղ</th><td class="sci">${x.g}</td></tr>
    <tr><th>Կյանքի տևողություն</th><td>${x.ls}</td></tr>
    <tr><th>Բազմացում / Ձագեր</th><td>${x.of}</td></tr>
    <tr><th>Պահպանության կարգավիճակ</th><td>${x.tg.join(", ")}</td></tr>
    <tr><th>Ապրելավայր</th><td>${x.h}</td></tr>
    <tr><th>Տարածվածություն</th><td>${x.r}</td></tr>
  </table>
  ${SEC.map((s,k)=>`<h2 class="sec">${k+1}. ${s}</h2><p class="leading-7">${x.d[k]}</p>`).join("")}
  <div class="clear-both"></div>`;
  window.scrollTo(0,0);
}
function route(){
  renderChrome();
  const m=location.hash.match(/^#a(\d+)$/);
  m&&D[m[1]]?renderArticle(+m[1]):renderList();
}
$("q").addEventListener("input",e=>{query=e.target.value;if(location.hash)history.replaceState(null,"",location.pathname);route();});
window.addEventListener("hashchange",route);
route();
</script>
