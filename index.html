];
const SEC=["Ընդհանուր նկարագրություն","Տարածվածություն և ապրելավայրեր","Կենսակերպ և էկոլոգիական նշանակություն","Պահպանության վիճակը"];

/* Վիքիպեդիայի հոդվածների վերնագրեր (ըստ հերթականության՝ առաջինը, որը նկար ունի) */
const WT=[
 ["Panthera_pardus_tulliana"],            /* 1. Կովկասյան ընձառյուծ */
 ["Armenian_mouflon","Mouflon"],          /* 2. Հայկական մուֆլոն */
 ["Wild_goat"],                           /* 3. Բեզոարյան այծ */
 ["Brown_bear"],                          /* 4. Գորշ արջ */
 ["Black_stork"],                         /* 5. Սև արագիլ */
 ["Tulipa_sosnowskyi","Tulip"],           /* 6. Վարդակակաչ */
 ["Gladiolus_dzhavakheticus","Gladiolus"],/* 7. Թրաշուշան */
 ["Prometheum_chrysanthum","Adonis_vernalis"], /* 8. Վարդակուկ / դեղին ծաղիկ */
 ["Nuphar_lutea"],                        /* 9. Կոկոռ դեղին */
 ["Helichrysum"]                          /* 10. Անթառամ */
];
const API="https://en.wikipedia.org/api/rest_v1/";
const BAD=/map|range|distribution|status|iucn|symbol|icon|logo|flag|coat|stamp|cites|skull|skeleton|diagram|chart|illustration|drawing|plate|painting|taxobox/i;
const sz=(s,n)=>s.replace(/\/\d+px-/,"/"+n+"px-");
const IMGS={};
function wiki(i){
  if(IMGS[i])return IMGS[i];
  return IMGS[i]=(async()=>{
    for(const t of WT[i]){
      try{
        const r=await fetch(API+"page/summary/"+t);
        if(!r.ok)continue;
        const j=await r.json();
        const lead=j.originalimage||j.thumbnail;
        if(!lead)continue;
        const base=(j.thumbnail||j.originalimage).source;
        const out={main:base,gal:[]};
        const leadName=decodeURIComponent(lead.source.split("/").filter(Boolean).pop()).replace(/^\d+px-/,"").replace(/_/g," ");
        try{
          const title=(j.titles&&j.titles.canonical)||t;
          const m=await fetch(API+"page/media-list/"+encodeURIComponent(title));
          if(m.ok){
            const mj=await m.json();
            for(const it of (mj.items||[])){
              if(it.type!=="image"||!it.srcset||!it.srcset.length)continue;
              const nm=(it.title||"").replace(/^File:/,"").replace(/_/g," ");
              if(!/\.(jpe?g|webp)$/i.test(nm)||BAD.test(nm)||nm===leadName)continue;
              let s=it.srcset[0].src;
              if(s.indexOf("//")===0)s="https:"+s;
              out.gal.push(s);
              if(out.gal.length>=3)break;
            }
          }
        }catch(e){}
        while(out.gal.length<3)out.gal.push(out.gal[0]||base);
        return out;
      }catch(e){}
    }
    return null;
  })();
}
function setImg(el,u){
  if(!u){el.style.display="none";return;}
  el.onerror=()=>{ if(el.getAttribute("src")!==u){el.src=u;}else{el.style.display="none";} };
  el.src=sz(u,500);
}
function hydrate(){
  document.querySelectorAll("img[data-wi]").forEach(el=>{
    const i=+el.dataset.wi,k=el.dataset.k;
    wiki(i).then(d=>{
      if(!d){el.style.display="none";return;}
      setImg(el,k==="m"?d.main:d.gal[+k]);
    });
  });
}

let cat="all",tag=null,query="";
const $=id=>document.getElementById(id);

function filtered(){
  return D.map((x,i)=>({...x,i})).filter(x=>
    (cat==="all"||x.t===cat)&&(!tag||x.tg.includes(tag))&&
    (x.n+x.l+x.d.join(" ")).toLowerCase().includes(query.toLowerCase()));
}
function go(h){location.hash=h;route();}
function renderChrome(){
  $("tabs").innerHTML=[["all","Բոլորը"],["a","Կենդանիներ"],["p","Բույսեր"]].map(([k,t])=>
    `<button onclick="cat='${k}';go('');" class="px-4 py-2 text-sm border-b-2 ${cat===k?'border-emerald-700 font-bold text-emerald-800':'border-transparent text-gray-600'}">${t}</button>`).join("");
  $("badges").innerHTML=[R,E,V].map(b=>
    `<button onclick="tag=tag==='${b}'?null:'${b}';go('');" class="text-xs px-2 py-1 rounded-full border ${tag===b?'bg-emerald-700 text-white':'bg-gray-50'}">${b}</button>`).join("");
  const f=filtered();
  $("toc").innerHTML=f.length?f.map((x,k)=>`<li><a href="#a${x.i}" class="hover:underline">${k+1}. ${x.n}</a></li>`).join(""):"<li class='text-gray-500'>Արդյունք չկա</li>";
}
function renderList(){
  const f=filtered();
  $("main").innerHTML=`<h2 class="text-2xl font-serif mb-1">Բոլոր հոդվածները</h2>
  <p class="text-sm text-gray-500 mb-4">Գտնվել է հոդված՝ ${f.length}</p>
  <div class="grid sm:grid-cols-2 gap-4">${f.map(x=>`
    <a href="#a${x.i}" class="border rounded overflow-hidden hover:shadow-md transition bg-white block">
      <div class="h-36 bg-emerald-100 flex items-center justify-center text-6xl relative">${x.e}
        <img data-wi="${x.i}" data-k="m" alt="${x.n}" loading="lazy" class="absolute inset-0 w-full h-full object-cover"></div>
      <div class="p-3"><h3 class="font-bold text-blue-800">${x.n}</h3>
      <p class="sci text-sm text-gray-600">${x.l}</p>
      <div class="mt-2 flex flex-wrap gap-1">${x.tg.map(b=>`<span class="text-xs bg-amber-100 text-amber-800 px-2 rounded-full">${b}</span>`).join("")}</div></div>
    </a>`).join("")||"<p>Ոչինչ չի գտնվել։</p>"}</div>`;
  hydrate();
}
function renderArticle(i){
  const x=D[i];
  $("main").innerHTML=`<a href="#" class="text-sm text-blue-700 hover:underline">← Վերադառնալ ցանկին</a>
  <h2 class="text-3xl font-serif border-b border-gray-400 mt-2 pb-1">${x.n}</h2>
  <p class="sci text-gray-600 mb-3">${x.l}</p>
  <table class="ib float-none md:float-right md:ml-5 mb-4 w-full md:w-72 border border-gray-300 bg-gray-50">
    <tr><td colspan="2" class="text-center font-bold bg-emerald-100">${x.n}</td></tr>
    <tr><td colspan="2" class="p-0"><div class="h-44 bg-emerald-100 flex items-center justify-center text-7xl relative">${x.e}
      <img data-wi="${i}" data-k="m" alt="${x.n}" class="absolute inset-0 w-full h-full object-cover"></div></td></tr>
    <tr><th colspan="2" class="text-center">Գիտական դասակարգում</th></tr>
    <tr><th>Թագավորություն</th><td>${x.k}</td></tr>
    <tr><th>Դաս</th><td>${x.c}</td></tr>
    <tr><th>Ընտանիք</th><td>${x.f}</td></tr>
    <tr><th>Ցեղ</th><td class="sci">${x.g}</td></tr>
    <tr><th>Պահպանության կարգավիճակ</th><td>${x.tg.join(", ")}</td></tr>
    <tr><th>Ապրելավայր</th><td>${x.h}</td></tr>
    <tr><th>Տարածվածություն</th><td>${x.r}</td></tr>
  </table>
  ${SEC.map((s,k)=>`<h2 class="sec">${k+1}. ${s}</h2><p class="leading-7">${x.d[k]}</p>`).join("")}
  <div class="clear-both"></div>
  <h2 class="sec">Պատկերասրահ</h2>
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">${[0,1,2].map(k=>`
    <figure class="border rounded overflow-hidden"><div class="h-36 bg-emerald-100 flex items-center justify-center text-5xl relative">${x.e}
    <img data-wi="${i}" data-k="${k}" alt="${x.n}" loading="lazy" class="absolute inset-0 w-full h-full object-cover"></div>
    <figcaption class="text-xs p-2 text-gray-600">${x.n}՝ պատկեր ${k+1}</figcaption></figure>`).join("")}</div>`;
  hydrate();
  window.scrollTo(0,0);
}
function route(){
  renderChrome();
  const m=location.hash.match(/^#a(\d+)$/);
  m&&D[m[1]]?renderArticle(+m[1]):renderList();
}
$("q").addEventListener("input",e=>{query=e.target.value;if(location.hash)history.replaceState(null,"",location.pathname);route();});
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
